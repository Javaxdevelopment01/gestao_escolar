      <h1>Relatórios</h1>

      <div class="filters">
        <select id="selectTipoRelatorio">
          <option value="">Seleciona Tipo de Relatório</option>

        <button class="btn-add" id="exportPDF"><i class="fas fa-file-pdf"></i> Exportar PDF</button>

      <table id="relatorioTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
